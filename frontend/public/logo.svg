<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="TableHive">
  <!--
    Background: change fill on the rect below.
    Use "none" or omit the rect for a transparent background.
  -->
  <rect id="background" width="720" height="220" fill="none"/>

  <g id="logo-mark" transform="translate(28, 38)">
    <!-- Honeycomb cluster -->
    <!-- Bottom-left -->
    <polygon points="52,86 26,71 26,41 52,26 78,41 78,71"
             fill="#E8B54A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
    <!-- Bottom-center (darker) -->
    <polygon points="104,86 78,71 78,41 104,26 130,41 130,71"
             fill="#C9891A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
    <!-- Bottom-right -->
    <polygon points="156,86 130,71 130,41 156,26 182,41 182,71"
             fill="#E8B54A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
    <!-- Top -->
    <polygon points="104,38 78,23 78,-7 104,-22 130,-7 130,23"
             fill="#F0C35C" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
    <!-- Small highlight band under top hex -->
    <path d="M82,28 L126,28" stroke="#F7E7B0" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="236" y="138"
        font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="72"
        font-weight="700"
        letter-spacing="-1.2"
        fill="#1A1A1A">TableHive</text>
</svg>
